name: Publish images

# A normal installation runs published images and never builds, so the images
# are the release artefact. This workflow is what makes
# `curl … install.sh | bash` possible on a host with no source tree.
#
# GHCR with the automatic GITHUB_TOKEN: no secret to rotate, and the package
# inherits the repository. A first publish creates the package as private —
# make it public once, under the repository's Packages settings, or the
# installer cannot pull it.

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/portta

jobs:
  panel:
    name: Panel image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Every compose default tag and VERSION have to agree, or an installation
      # pinned by those files would pull an image that was never published.
      # This checked only the panel's overlay, and portta-auth sat a release
      # behind through 0.4.0 because of it. With the test workflow gone this is
      # the last automated guard on what the installer will pull.
      - name: Every compose default tag matches VERSION
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          stale=$(grep -rhoE 'ghcr\.io/[^/]+/portta:[0-9][^}]*' \
            docker/compose/compose.yaml docker/compose/*/*.yaml \
            | sort -u | grep -v ":${version}\$" || true)
          if [ -n "$stale" ]; then
            echo "these default to a tag this workflow is not publishing (VERSION is ${version}):"
            printf '  %s\n' $stale
            exit 1
          fi
          grep -Fq "portta:${version}" docker/compose/features/web.yaml \
            || { echo "docker/compose/features/web.yaml does not default to portta:${version}"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Portta
            org.opencontainers.image.description=Administration panel for Portta
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          # arm64 matters here: development machines are increasingly Apple
          # silicon, and the installer is meant to work on one.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PORTTA_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What was published
        run: |
          printf 'published:\n%s\n' '${{ steps.meta.outputs.tags }}'
          printf '\nIf the installer cannot pull this, the package is still private.\n'
          printf 'Make it public once: repository -> Packages -> portta -> Package settings.\n'
